services:
  erebus-space-cloud:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erebus-space-cloud-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://erebus-api:1000
      EREBUS_DATA_CENTER_NAME: EREBUS-CORE-01
      ORBITAL_ALTITUDE_KM: 420
    depends_on:
      erebus-api:
        condition: service_healthy
    networks: [erebus-orbital-net]

  erebus-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erebus-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 1000
      DATABASE_URL: postgres://${EREBUS_DB_USER:-erebus_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgresql:5432/${POSTGRES_DB:-erebus_db}
      DEFAULT_ACCOUNT_NAME: ${DEFAULT_ACCOUNT_NAME:?Set DEFAULT_ACCOUNT_NAME in .env}
      DEFAULT_ACCOUNT_EMAIL: ${DEFAULT_ACCOUNT_EMAIL:?Set DEFAULT_ACCOUNT_EMAIL in .env}
      DEFAULT_ACCOUNT_PASSWORD: ${DEFAULT_ACCOUNT_PASSWORD:?Set DEFAULT_ACCOUNT_PASSWORD in .env}
      RECEIVER_WS_URL: ${RECEIVER_WS_URL:-ws://192.168.1.100/ws}
      RECEIVER_HTTP_URL: ${RECEIVER_HTTP_URL:-http://192.168.1.100}
      RECEIVER_API_KEY: ${RECEIVER_API_KEY:-}
      RECEIVER_STALE_AFTER_MS: ${RECEIVER_STALE_AFTER_MS:-15000}
      RECEIVER_RECONNECT_MAX_MS: ${RECEIVER_RECONNECT_MAX_MS:-30000}
      SIMULATION_MODE: ${SIMULATION_MODE:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:1000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [erebus-orbital-net]

  erebus-super-admin:
    build:
      context: ./super-admin-ui
      dockerfile: Dockerfile
    container_name: erebus-super-admin
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      API_ORIGIN: http://erebus-api:1000
    depends_on:
      erebus-api:
        condition: service_healthy
    networks: [erebus-orbital-net]

  postgresql:
    image: postgres:15-alpine
    container_name: erebus-postgresql-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EREBUS_DB_USER:-erebus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-erebus_db}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [erebus-orbital-net]

networks:
  erebus-orbital-net:
    driver: bridge

volumes:
  postgres-data:
